<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sketch Board</title>
		<style>
			body {
				margin: 0;
				font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #111114;
				color: #f4f4f5;
				line-height: 1.6;
			}

			main {
				width: min(760px, calc(100% - 48px));
				margin: 0 auto;
				padding: 72px 0;
			}

			h1 {
				margin: 0 0 16px;
				font-size: 40px;
				line-height: 1.1;
			}

			p {
				color: rgba(244, 244, 245, 0.82);
				font-size: 18px;
			}

			img {
				width: 112px;
				height: 112px;
				border-radius: 24px;
				margin-bottom: 28px;
			}

			a {
				color: #8ab4ff;
			}

			.links {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
				margin-top: 28px;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/sketch-board-google-auth-logo.png" alt="Sketch Board logo" />
			<h1>Sketch Board</h1>
			<p>
				Sketch Board is a browser-based whiteboard for creating diagrams with tldraw. Google
				sign-in is used only to identify the user and sync that user's board data to cloud
				storage.
			</p>
			<div class="links">
				<a href="/">Open Sketch Board</a>
				<a href="/privacy.html">Privacy Policy</a>
				<a href="/terms.html">Terms of Service</a>
			</div>
		</main>
	</body>
</html>
